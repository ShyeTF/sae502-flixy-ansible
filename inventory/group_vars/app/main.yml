---
# vm-app : seul nginx publie 80/443, ouverts au LAN seulement
docker_user_regles:
  - nom: nginx http
    port: 80
    sources: ["{{ lan_cidr }}"]
  - nom: nginx https
    port: 443
    sources: ["{{ lan_cidr }}"]

# 4 Go de RAM seulement : swap pour le build des images (si pas de partition swap)
common_swap_mo: 2048
