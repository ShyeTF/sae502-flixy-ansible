---
# vm-media : seul Radarr publie le 7878, et seulement pour vm-app (l'api Flixy)
docker_user_regles:
  - nom: radarr
    port: "{{ ports.radarr }}"
    sources: ["{{ app_ip }}"]

# Indexeur Prowlarr : Internet Archive (archive.org), indexeur public et legal.
# Definition "internetarchive" presente dans Prowlarr 2.6.5 (depot Prowlarr/Indexers v11).
# Les films du domaine public / Creative Commons y sont publies en torrent.
prowlarr_indexers:
  - name: Internet Archive
    definition: internetarchive
    fields:
      titleOnly: true
      noMagnet: false
