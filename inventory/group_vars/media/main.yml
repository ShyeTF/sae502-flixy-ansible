---
# vm-media : seul Radarr publie le 7878, et seulement pour vm-app (l'api Flixy)
docker_user_regles:
  - nom: radarr
    port: "{{ ports.radarr }}"
    sources: ["{{ app_ip }}"]

# Indexeur Prowlarr : Internet Archive teste le 12/11/2026, NON retenu.
# La definition "internetarchive" existe bien dans Prowlarr 2.6.5, mais archive.org
# ne repond pas aux requetes qui portent l'user-agent de Prowlarr (time-out apres 60 s,
# alors que la meme requete avec curl repond en moins de 5 s). Prowlarr refuse donc
# d'enregistrer l'indexeur. On garde la liste vide : demo de secours (import + webhook).
# Pour reessayer plus tard :
# prowlarr_indexers:
#   - name: Internet Archive
#     definition: internetarchive
#     fields: { titleOnly: true }
prowlarr_indexers: []
