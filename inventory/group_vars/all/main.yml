---
# Variables communes aux deux VM. Aucune image en latest.

debian_release: trixie

# Adresses utilisees pour le filtrage (exemple, a adapter)
admin_ip: 192.168.1.20           # Mac, noeud de controle Ansible (SSH)
app_ip: 192.168.1.50             # vm-app
media_ip: 192.168.1.51           # vm-media
webhook_allowed_ip: "{{ media_ip }}"   # seul Radarr peut appeler /v1/radarr/webhook

# Utilisateur des conteneurs (Radarr, qBittorrent, api) et des fichiers NFS
flixy_uid: 1000
flixy_gid: 1000
data_mode: "2775"

data_path: /data/flixy
import_path: "{{ data_path }}/import"   # repli : import manuel Radarr
compose_dir: /opt/flixy

# NFSv4, export vers vm-app uniquement
nfs_export_client: "{{ app_ip }}"
nfs_export_options: "rw,sync,no_subtree_check,root_squash"
nfs_mount_opts: "nfsvers=4.2,_netdev"

# Tags verifies le 24/10/2026, digests dans docs/images.md

# Images construites par la CI GitLab, tag fixe pour la SAE
# (sae-1.0 pas encore construit, voir docs/images.md)
flixy_registry: registry.gitlab.com/kineflix
flixy_image_tag: sae-1.0

# Commit utilise pour chaque image Flixy. A completer quand sae-1.0 est construit,
# repris dans le manifest.json de chaque sauvegarde.
flixy_code_refs:
  web: "a completer"
  api: "a completer"
  migrator: "a completer"

images:
  web: "{{ flixy_registry }}/front-end/web:{{ flixy_image_tag }}"
  api: "{{ flixy_registry }}/back-end/api:{{ flixy_image_tag }}"
  migrator: "{{ flixy_registry }}/back-end/migrator:{{ flixy_image_tag }}"
  postgres: "postgres:18.6-alpine"
  valkey: "valkey/valkey:9.1.2-alpine"
  minio: "pgsty/minio:RELEASE.2026-08-04T00-00-00Z"
  mc: "pgsty/mc:RELEASE.2026-08-04T00-00-00Z"   # client MinIO pour backup/restore
  nginx: "nginx:1.30.6-alpine"
  radarr: "lscr.io/linuxserver/radarr:6.4.4"
  prowlarr: "lscr.io/linuxserver/prowlarr:2.6.5"
  qbittorrent: "lscr.io/linuxserver/qbittorrent:5.2.4"

# Ports. Publies : 80/443 (nginx, vm-app) et 7878 (Radarr, vm-media) seulement.
ports:
  http: 80
  https: 443
  api: 3000          # interne
  radarr: 7878       # publie, filtre DOCKER-USER
  prowlarr: 9696     # interne, tunnel SSH
  qbittorrent: 8080  # interne, tunnel SSH
  nfs: 2049

webhook_path: /v1/radarr/webhook
minio_bucket: user.picture

# Sauvegarde : un dossier par jeu, <backup_dir>/<backup_id>/ sur vm-media
# (dump PostgreSQL + copie MinIO + SHA256SUMS + manifest.json)
backup_dir: /srv/backups/flixy          # vm-media, hors de l'export NFS
backup_staging_dir: /var/backups/flixy  # vm-app, preparation du jeu avant envoi
backup_id_format: "%Y%m%d-%H%M%S"       # backup_id = horodatage, ex. 20261024-030000
backup_retention_days: 7                # on garde toujours au moins le dernier jeu complet
backup_timer_oncalendar: "*-*-* 03:00:00"

# Maintenance (restauration). A true : api (qui fait aussi tourner le worker BullMQ) et migrator ne sont pas demarres
# et nginx renvoie 503 (site + webhook). Ne pas changer ici, restore.yml le passe a true.
flixy_maintenance: false
restore_lock_file: "{{ compose_dir }}/.restauration-en-cours"
# services qui ecrivent dans la base ou dans MinIO, arretes pendant la restauration
# le worker BullMQ tourne dans le conteneur api, pas de conteneur a part
flixy_write_services:
  - api
  - migrator
flixy_health_path: /v1/health           # teste postgres, valkey et minio, 503 si une dependance tombe
