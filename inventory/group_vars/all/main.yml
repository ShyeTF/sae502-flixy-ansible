---
# Variables communes aux deux VM. Aucune image en latest.

debian_release: trixie

# ---------------------------------------------------------------------------
# Reseau (choix de Leo, novembre 2026)
# - vm-app = 192.168.1.54, vm-media = 192.168.1.55 (192.168.1.50 est pris par un switch)
# - noeud de controle actuel : la machine de rebond qui passe par le Proxmox
#   (ProxyJump pve-p340), donc les connexions SSH arrivent depuis 192.168.1.10
# - plus tard (soutenance) : le Mac de Leo. Ajouter son IP dans admin_ips quand
#   il sera sur le LAN (ou via Tailscale), puis relancer deploy.yml
# ---------------------------------------------------------------------------
admin_ip: 192.168.1.10           # noeud de controle actuel (rebond via pve-p340)
admin_ips:                        # toutes les IP autorisees en SSH (UFW)
  - "{{ admin_ip }}"
  # - <ip du Mac>                 # a ajouter pour la demo depuis le Mac
app_ip: 192.168.1.54             # vm-app
media_ip: 192.168.1.55           # vm-media
net_prefix: 24
net_gateway: 192.168.1.1
net_dns: 192.168.1.1
lan_cidr: 192.168.1.0/24         # qui a le droit d'ouvrir le site en HTTPS
webhook_allowed_ip: "{{ media_ip }}"   # seul Radarr peut appeler /v1/radarr/webhook

# Adresse du site (pas de nom de domaine pour la copie SAE, on reste sur l'IP)
flixy_public_host: "{{ app_ip }}"

# Ressources des VM (pour info / creation des VM sur Proxmox, pas utilise par les roles)
# RAM reduite par rapport au plan (8 Go / 4 Go) : le Proxmox n'a qu'environ 5 Go
# de libre. Ballooning active (minimum 2 Go / 1 Go) pour ne pas gener les autres VM.
vm_resources:
  vm-app: { vmid: 104, cores: 4, memory_mb: 4096, balloon_mb: 2048, disk_gb: 40 }
  vm-media: { vmid: 105, cores: 2, memory_mb: 2048, balloon_mb: 1024, disk_gb: 100 }

# Utilisateur des conteneurs (Radarr, qBittorrent, api) et des fichiers NFS
flixy_uid: 1000
flixy_gid: 1000
data_mode: "2775"

data_path: /data/flixy
import_path: "{{ data_path }}/import"   # repli : import manuel Radarr
demo_path: "{{ data_path }}/demo"       # fichiers de la demo de secours
compose_dir: /opt/flixy                 # vm-app
media_compose_dir: /opt/flixy-media     # vm-media

# NFSv4, export vers vm-app uniquement
nfs_export_client: "{{ app_ip }}"
nfs_export_options: "rw,sync,no_subtree_check,root_squash"
nfs_mount_opts: "nfsvers=4.2,_netdev"

# ---------------------------------------------------------------------------
# Images
# ---------------------------------------------------------------------------
# Tags publics verifies le 24/10/2026, digests dans docs/images.md

# web, api et migrator : construites par moi sur vm-app (role flixy_app, images.yml)
# a partir d'un clone en lecture seule du code Flixy, au commit note ci-dessous.
# Rien n'est pousse sur le GitLab ni sur le registre de Flixy : les images restent
# locales a vm-app, avec le tag fixe sae-1.0.
flixy_image_prefix: flixy-sae
flixy_image_tag: sae-1.0

# Depots du code (lecture seule, clones sur le noeud de controle)
flixy_src:
  back:
    repo: "https://gitlab.com/kineflix/back-end.git"
    version: "44e371bb29f15637114ce78cac4e7aa0da9c1b55"   # branche leo-p au 30/10
  front:
    repo: "https://gitlab.com/kineflix/front-end.git"
    version: "feb36a6a530bd08108c94ca4b69b1aea1db65864"   # branche leo-p au 30/10

# Commit de chaque image Flixy, repris dans le manifest.json de chaque sauvegarde
flixy_code_refs:
  web: "{{ flixy_src.front.version }}"       # kineflix/front-end, leo-p
  api: "{{ flixy_src.back.version }}"        # kineflix/back-end, leo-p
  migrator: "{{ flixy_src.back.version }}"   # meme depot et meme commit que l'api

images:
  web: "{{ flixy_image_prefix }}/web:{{ flixy_image_tag }}"
  api: "{{ flixy_image_prefix }}/api:{{ flixy_image_tag }}"
  migrator: "{{ flixy_image_prefix }}/migrator:{{ flixy_image_tag }}"
  postgres: "postgres:18.6-alpine"
  valkey: "valkey/valkey:9.1.2-alpine"
  minio: "pgsty/minio:RELEASE.2026-08-04T00-00-00Z"
  mc: "pgsty/mc:RELEASE.2026-08-04T00-00-00Z"   # client MinIO pour backup/restore
  nginx: "nginx:1.30.6-alpine"
  radarr: "lscr.io/linuxserver/radarr:6.4.4"
  prowlarr: "lscr.io/linuxserver/prowlarr:2.6.5"
  qbittorrent: "lscr.io/linuxserver/qbittorrent:5.2.4"

# Ports. Publies : 80/443 (nginx, vm-app) et 7878 (Radarr, vm-media) seulement.
ports:
  http: 80
  https: 443
  api: 3000          # interne
  web: 3000          # interne
  radarr: 7878       # publie, filtre DOCKER-USER
  prowlarr: 9696     # interne, tunnel SSH
  qbittorrent: 8080  # interne, tunnel SSH
  nfs: 2049

# Reseau docker de vm-media : sous-reseau fixe pour joindre les conteneurs depuis
# l'hote (taches API d'Ansible, tunnel SSH) sans publier leurs ports
media_docker_subnet: 172.30.0.0/24
media_docker_gateway: 172.30.0.1    # IP de l'hote vm-media sur ce reseau
media_docker_ips:
  radarr: 172.30.0.10
  prowlarr: 172.30.0.11
  qbittorrent: 172.30.0.12

webhook_path: /v1/radarr/webhook
minio_bucket: user.picture
postgres_user: flixy
postgres_db: flixy

# Sauvegarde : un dossier par jeu, <backup_dir>/<backup_id>/ sur vm-media
# (dump PostgreSQL + copie MinIO + SHA256SUMS + manifest.json)
backup_dir: /srv/backups/flixy          # vm-media, hors de l'export NFS
backup_staging_dir: /var/backups/flixy  # vm-app, preparation du jeu avant envoi
backup_user: flixy-backup               # vm-media, compte limite a rsync (rrsync)
backup_cle_ssh: /root/.ssh/flixy-backup # vm-app, cle pour l'envoi vers vm-media
backup_id_format: "%Y%m%d-%H%M%S"       # backup_id = horodatage, ex. 20261024-030000
backup_retention_days: 7                # on garde toujours au moins le dernier jeu complet
backup_timer_oncalendar: "*-*-* 03:00:00"

# Maintenance (restauration). A true : api (qui fait aussi tourner le worker BullMQ) et migrator ne sont pas demarres
# et nginx renvoie 503 (site + webhook). Ne pas changer ici, restore.yml le passe a true.
flixy_maintenance: false
restore_lock_file: "{{ compose_dir }}/.restauration-en-cours"
# services qui ecrivent dans la base ou dans MinIO, arretes pendant la restauration
# le worker BullMQ tourne dans le conteneur api, pas de conteneur a part
flixy_write_services:
  - api
  - migrator
flixy_health_path: /v1/health           # teste postgres, valkey et minio, 503 si une dependance tombe
