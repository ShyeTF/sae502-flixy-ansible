# Inventaire d'exemple. Copier en hosts.yml (non versionne) et adapter.
# Les deux VM sont en Debian 13 (trixie), IP fixes en /24.
all:
  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3
    net_prefix: 24
    net_gateway: 192.168.1.1
  children:
    app:
      hosts:
        vm-app:
          ansible_host: 192.168.1.50
    media:
      hosts:
        vm-media:
          ansible_host: 192.168.1.51
