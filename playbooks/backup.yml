---
# Sauvegarde a la main. Le timer quotidien du role backup lance le meme script.
#   ansible-playbook playbooks/backup.yml --ask-vault-pass
#
# Un jeu = un dossier <backup_dir>/<backup_id>/ sur vm-media :
#   postgres.dump   dump pg_dump -Fc
#   minio/          copie du bucket a l'instant de la sauvegarde
#   SHA256SUMS      sha256 de tous les fichiers du jeu
#   manifest.json   id, date, tags et digests des images, refs du code, comptages
# Le manifest est ecrit en dernier : un dossier sans manifest.json est incomplet
# et restore.yml ne le prend pas.

- name: Sauvegarde Flixy (jeu identifie)
  hosts: app
  become: true
  vars:
    backup_id: "{{ now(fmt=backup_id_format) }}"
  tasks:
    - name: Figer le backup_id pour tout le playbook
      ansible.builtin.set_fact:
        backup_id: "{{ backup_id }}"
      run_once: true

    - name: Afficher le jeu en cours
      ansible.builtin.debug:
        msg: "jeu {{ backup_id }} -> {{ media_ip }}:{{ backup_dir }}/{{ backup_id }}/"

    - name: A faire - 1. dossier de preparation
      ansible.builtin.debug:
        msg: "mkdir -p {{ backup_staging_dir }}/{{ backup_id }}/minio (0700, root)"

    - name: A faire - 2. pause des ecritures
      ansible.builtin.debug:
        msg: "compose stop {{ flixy_write_services | join(' ') }} (quelques secondes) pour que dump et objets soient pris au meme moment"

    - name: A faire - 3. dump PostgreSQL
      ansible.builtin.debug:
        msg: "docker compose exec -T postgres pg_dump -Fc -U flixy flixy > {{ backup_id }}/postgres.dump + nb de lignes par table"

    - name: A faire - 4. copie MinIO dans le jeu
      ansible.builtin.debug:
        msg: "conteneur {{ images.mc }} : mc mirror local/{{ minio_bucket }} /backup/minio (dossier du jeu, pas un miroir commun)"

    - name: A faire - 5. relance des ecritures
      ansible.builtin.debug:
        msg: "compose start {{ flixy_write_services | join(' ') }}"

    - name: A faire - 6. SHA256SUMS et manifest.json
      ansible.builtin.debug:
        msg: "sha256sum de tous les fichiers, puis manifest.json (backup_id, date, flixy_image_tag, digests, flixy_code_refs, nb objets)"

    - name: A faire - 7. envoi sur vm-media
      ansible.builtin.debug:
        msg: "rsync -a {{ backup_id }}/ {{ media_ip }}:{{ backup_dir }}/{{ backup_id }}/ (manifest.json envoye en dernier), puis sha256sum -c cote vm-media"

    - name: A faire - 8. menage du dossier de preparation
      ansible.builtin.debug:
        msg: "rm -rf {{ backup_staging_dir }}/{{ backup_id }} si l'envoi est OK"

- name: Retention sur vm-media
  hosts: media
  become: true
  tasks:
    - name: A faire - purge des jeux de plus de {{ backup_retention_days }} jours
      ansible.builtin.debug:
        msg: "find {{ backup_dir }} -mindepth 1 -maxdepth 1 -type d -mtime +{{ backup_retention_days }}, en gardant toujours le dernier jeu complet"
