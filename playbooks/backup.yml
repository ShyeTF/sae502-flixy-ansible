---
# Sauvegarde a la main. Le timer quotidien du role backup lance le meme script.
#   ansible-playbook playbooks/backup.yml --ask-vault-pass
#   ansible-playbook playbooks/backup.yml -e backup_id=20261024-030000 --ask-vault-pass
#
# Un jeu = un dossier <backup_dir>/<backup_id>/ sur vm-media :
#   postgres.dump   dump pg_dump -Fc
#   minio/          copie du bucket a l'instant de la sauvegarde
#   lignes.txt      nombre de lignes par table
#   objets.txt      liste des objets MinIO (nom + taille)
#   SHA256SUMS      sha256 de tous les fichiers du jeu
#   manifest.json   id, date, tags et id des images, refs du code, comptages
# Le manifest est ecrit en dernier : un dossier sans manifest.json est incomplet
# et restore.yml ne le prend pas.

- name: Sauvegarde Flixy (jeu identifie)
  hosts: app
  become: true
  vars:
    backup_id: "{{ now(fmt=backup_id_format) }}"
  tasks:
    - name: Figer le backup_id pour tout le playbook
      ansible.builtin.set_fact:
        backup_id: "{{ backup_id }}"
      run_once: true

    - name: Lancer flixy-backup {{ backup_id }}
      ansible.builtin.command: /usr/local/sbin/flixy-backup {{ backup_id }}
      register: sortie_backup
      changed_when: true

    - name: Sortie du script
      ansible.builtin.debug:
        var: sortie_backup.stdout_lines

- name: Controle du jeu sur vm-media
  hosts: media
  become: true
  vars:
    backup_id: "{{ hostvars[groups['app'][0]].backup_id }}"
  tasks:
    - name: Controle d'integrite (sha256sum -c)
      ansible.builtin.command: sha256sum -c --quiet SHA256SUMS
      args:
        chdir: "{{ backup_dir }}/{{ backup_id }}"
      changed_when: false

    - name: Lire le manifest
      ansible.builtin.slurp:
        src: "{{ backup_dir }}/{{ backup_id }}/manifest.json"
      register: manifest

    - name: Manifest du jeu (a garder dans tests/preuves/)
      ansible.builtin.debug:
        msg: "{{ manifest.content | b64decode | from_json }}"

- name: Retention sur vm-media
  hosts: media
  become: true
  tasks:
    - name: Purge des jeux de plus de {{ backup_retention_days }} jours (on garde le dernier complet)
      ansible.builtin.command: /usr/local/sbin/flixy-retention
      register: retention
      changed_when: "'supprime' in retention.stdout"

    - name: Sortie de la retention
      ansible.builtin.debug:
        var: retention.stdout_lines
