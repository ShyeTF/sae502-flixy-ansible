---
# Restauration.
#   ansible-playbook playbooks/restore.yml                      -> dernier dump
#   ansible-playbook playbooks/restore.yml -e backup_file=...   -> dump choisi
# Les configs (Radarr, Prowlarr, qBittorrent, nginx, compose) ne sont pas
# sauvegardees : deploy.yml les recree depuis l'inventaire et Vault.
# Les medias ne sont ni sauvegardes ni touches.

- name: Recreer les configs et les conteneurs
  ansible.builtin.import_playbook: deploy.yml

- name: Restauration des donnees Flixy
  hosts: app
  become: true
  vars:
    backup_file: latest
  tasks:
    - name: A faire - choisir le dump
      ansible.builtin.debug:
        msg: "dump : {{ backup_file }} (dernier de {{ media_ip }}:{{ backup_dir }} par defaut)"

    - name: A faire - PostgreSQL
      ansible.builtin.debug:
        msg: "arret api, drop/create de la base, pg_restore, migrator puis api"

    - name: A faire - MinIO
      ansible.builtin.debug:
        msg: "recopie du miroir dans le bucket {{ minio_bucket }}"
