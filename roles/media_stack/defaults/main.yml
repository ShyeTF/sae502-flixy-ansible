---
# defaults file for roles/media_stack
# Etat complet de Radarr recree par API (voir docs/radarr.md).
# Chaque element : GET de la liste, recherche par nom, POST si absent, PUT si different.

# URL vues depuis l'hote vm-media (Ansible) : IP fixes des conteneurs, rien n'est publie
radarr_api: "http://{{ media_docker_ips.radarr }}:{{ ports.radarr }}/api/v3"
prowlarr_api: "http://{{ media_docker_ips.prowlarr }}:{{ ports.prowlarr }}/api/v1"
qbittorrent_api: "http://{{ media_docker_ips.qbittorrent }}:{{ ports.qbittorrent }}/api/v2"

# URL vues entre conteneurs (meme reseau docker, par nom)
prowlarr_url_internal: "http://prowlarr:{{ ports.prowlarr }}"
radarr_url_internal: "http://radarr:{{ ports.radarr }}"

# meme systeme de fichiers pour downloads et films -> deplacement/hardlink, pas de copie
radarr_root_folder: "{{ data_path }}/films"
downloads_path: "{{ data_path }}/downloads"

radarr_quality_profile: "HD-1080p"     # profil livre avec Radarr, recree s'il manque

qbittorrent_category: radarr
qbittorrent_category_path: "{{ downloads_path }}/{{ qbittorrent_category }}"

radarr_download_client:
  name: qBittorrent
  implementation: QBittorrent
  host: qbittorrent
  port: "{{ ports.qbittorrent }}"
  category: "{{ qbittorrent_category }}"

radarr_webhook:
  name: Flixy
  url: "https://{{ flixy_public_host }}{{ webhook_path }}"
  method: 1            # 1 = POST
  on_download: true
  on_upgrade: true
  on_movie_delete: true
  on_movie_file_delete: true

# config/mediamanagement
radarr_media_management:
  copyUsingHardlinks: true
  setPermissionsLinux: true
  chmodFolder: "775"     # le bit setgid est deja pose sur les dossiers parents par le role nfs
  chownGroup: "{{ flixy_gid | string }}"

# config/naming
radarr_naming:
  renameMovies: true
  movieFolderFormat: "{Movie Title} ({Release Year})"
  standardMovieFormat: "{Movie Title} ({Release Year}) {Quality Full}"

# config/host : le cert de nginx est auto-signe
radarr_certificate_validation: disabledForLocalAddresses

# Prowlarr : application Radarr en synchro complete
prowlarr_app_sync_level: fullSync

# Indexeurs de Prowlarr. A DECIDER (Leo) : uniquement des indexeurs publics qui
# proposent des contenus libres (voir docs/medias.md). Format d'une entree :
#   - name: "Nom affiche"
#     definition: "nom de la definition Prowlarr (champ definitionName du schema)"
#     fields: {}            # champs propres a l'indexeur (baseUrl...), souvent vide
# Tant que la liste est vide, le controle final previent mais n'echoue pas :
# seule la demo de secours (import + webhook) est possible.
prowlarr_indexers: []
