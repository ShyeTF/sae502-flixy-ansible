---
docker_paquets:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Regles de la chaine DOCKER-USER (ports publies par Docker, qui passent devant UFW).
# Chaque entree : port publie sur l'hote + sources autorisees, tout le reste est jete.
# Definies dans group_vars (app / media), vide par defaut.
docker_user_regles: []

# interface LAN de la VM (trafic entrant filtre par DOCKER-USER)
docker_user_interface: "{{ ansible_facts['default_ipv4']['interface'] | default('ens18') }}"
