---
# tasks file for flixy_app
- name: Creer le dossier du compose Flixy
  ansible.builtin.file:
    path: "{{ compose_dir }}"
    state: directory
    mode: "0750"
  become: true

- name: A faire - compose Jinja2 (web, api, migrator, postgres, valkey, minio)
  ansible.builtin.debug:
    msg: "flixy_app : {{ images.postgres }}, {{ images.valkey }}, {{ images.minio }}"
