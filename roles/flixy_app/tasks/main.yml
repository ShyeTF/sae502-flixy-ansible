---
# tasks file for flixy_app
- name: Creer le dossier du compose Flixy
  ansible.builtin.file:
    path: "{{ compose_dir }}"
    state: directory
    mode: "0750"
  become: true

- name: A faire
  ansible.builtin.debug:
    msg: "flixy_app : compose Jinja2 (web/api/migrator {{ flixy_image_tag }}, postgres, valkey, minio non publies), verif NFS avant up, migrator avant api"
