---
# tasks file for nfs
# Le meme role sert aux deux VM : export sur vm-media, montage sur vm-app.
- name: Partie serveur (vm-media)
  ansible.builtin.include_tasks: serveur.yml
  when: "'media' in group_names"

- name: Partie client (vm-app)
  ansible.builtin.include_tasks: client.yml
  when: "'app' in group_names"
