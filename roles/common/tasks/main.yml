---
# tasks file for common
- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - sudo
      - curl
      - ufw
      - rsync
    state: present
    update_cache: true
  become: true

- name: A faire - utilisateur technique, cles SSH, ufw
  ansible.builtin.debug:
    msg: "common : base installee sur {{ inventory_hostname }}"
