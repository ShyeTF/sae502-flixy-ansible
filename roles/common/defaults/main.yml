---
# utilisateur qui lance les playbooks (cle SSH du noeud de controle)
deploy_user: deploy
deploy_ssh_pubkey: "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub') }}"

# IP fixe posee par Ansible (ifupdown). Par defaut non : l'IP est donnee a la creation
# de la VM (installateur ou cloud-init). Si true, le changement se fait au prochain reboot.
common_ip_fixe: false
common_interface: ens18

common_paquets:
  - sudo
  - curl
  - ca-certificates
  - ufw
  - rsync
  - python3-requests
  - jq
