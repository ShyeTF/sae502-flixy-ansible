---
# tasks file for backup
- name: Creer le dossier des sauvegardes
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: "0750"
  become: true
  when: "'media' in group_names"

- name: A faire
  ansible.builtin.debug:
    msg: "backup : timer quotidien pg_dump + mc mirror {{ minio_bucket }}, rsync/SSH vers vm-media, {{ backup_retention_days }} jours"
